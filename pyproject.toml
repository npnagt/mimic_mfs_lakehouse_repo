[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-lakehouse"
version = "0.1.0"
description = "Reference implementation of the Multimodal Fusion Schema on an Apache Iceberg lakehouse over MIMIC-IV"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
# for measure_native_vs_external_join.py -- the external-compute arm
benchmark = [
  "duckdb>=1.0",
  "pyarrow>=15.0",
]
# for validate_rq2_queries.py --execute (the paper's RQ1): one Excel tab per query's result set
reports = [
  "openpyxl>=3.1",
]

[project.scripts]
mimic-lakehouse = "mimic_lakehouse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
